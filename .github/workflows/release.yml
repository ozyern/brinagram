name: Build signed release APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # needed to publish GitHub Releases for tags

    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_VERSION: 3.22.1
      # arm64 + armv7 cover real phones; x86 builds are only useful for emulators.
      ABIS: arm64-v8a,armeabi-v7a

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
          key: cxx-${{ runner.os }}-arm64-armv7-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt', '.gitmodules') }}

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BRINA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret BRINA_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brinagram-release.jks"
          echo "BRINA_KEYSTORE_FILE=$RUNNER_TEMP/brinagram-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          BRINA_KEYSTORE_PASSWORD: ${{ secrets.BRINA_KEYSTORE_PASSWORD }}
          BRINA_KEY_ALIAS: ${{ secrets.BRINA_KEY_ALIAS }}
          BRINA_KEY_PASSWORD: ${{ secrets.BRINA_KEY_PASSWORD }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -PbrinaAbis="${ABIS}" \
            -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g" \
            --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -5
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          cp "$APK" "dist/BrinaGram-${VERSION}-${GITHUB_SHA::7}.apk"
          echo "APK_PATH=$(ls dist/*.apk)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrinaGram-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload mapping (for crash deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: TMessagesProj_App/build/outputs/mapping/
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
